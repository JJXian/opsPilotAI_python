<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpsPilotAI</title>
    <link rel="stylesheet" href="/static/styles.css">
    <!-- Markdown 渲染库 -->
    <script src="https://cdn.jsdelivr.net/npm/marked@11.1.1/marked.min.js"></script>
    <!-- 代码高亮库（可选） -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github.min.css">
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/es/highlight.min.js"></script>
</head>
<body>
    <div class="app-layout">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="brand-mark">OP</div>
                <div class="brand-copy">
                    <h2 class="sidebar-title">OpsPilotAI</h2>
                    <span>AI 运维工作台</span>
                </div>
            </div>
            
            <div class="sidebar-content">
                <div class="sidebar-section">
                    <div class="sidebar-section-title">工作区</div>
                    <button class="new-chat-btn" id="newChatBtn">
                        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M12 5V19M5 12H19" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                        </svg>
                        <span>新建对话</span>
                    </button>
                </div>
                
                <div class="chat-history-section">
                    <div class="history-header">
                        <span>近期对话</span>
                    </div>
                    <div class="chat-history-list" id="chatHistoryList">
                        <!-- 历史对话列表将在这里动态生成 -->
                    </div>
                </div>

                <div class="sidebar-footer">
                    <div class="runtime-card">
                        <span class="status-dot"></span>
                        <div>
                            <strong>Qwen Max</strong>
                            <span>DashScope 在线</span>
                        </div>
                    </div>
                </div>
            </div>
        </aside>

        <main class="main-content">
            <header class="topbar">
                <div class="topbar-title">
                    <span class="breadcrumb">工作台 / 智能问答</span>
                    <h1>运维助手</h1>
                </div>
                <div class="topbar-actions">
                    <div class="model-chip">
                        <span class="status-dot"></span>
                        <span>qwen-max</span>
                    </div>
                    <div class="model-chip">
                        <span>知识库</span>
                        <strong id="knowledgeDocumentCount">-- 文档</strong>
                    </div>
                    <button class="knowledge-manage-btn" id="manageKnowledgeBtn" title="知识库管理">
                        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                            <path d="M4 5.5C4 4.67 4.67 4 5.5 4H10L12 6H18.5C19.33 6 20 6.67 20 7.5V18.5C20 19.33 19.33 20 18.5 20H5.5C4.67 20 4 19.33 4 18.5V5.5Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
                            <path d="M8 11H16M8 15H13" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                        </svg>
                        <span>知识库</span>
                    </button>
                    <div class="model-chip">
                        <span>模式</span>
                        <strong id="modeStatusText">快速</strong>
                    </div>
                    <button class="ai-ops-top-btn" id="aiOpsSidebarBtn">
                        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M12 2L2 7L12 12L22 7L12 2Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M2 17L12 22L22 17" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M2 12L12 17L22 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                        <span>AI Ops</span>
                    </button>
                </div>
            </header>

            <section class="workspace">
                <div class="chat-container">
                    <div class="welcome-greeting" id="welcomeGreeting">
                        <span class="welcome-kicker">OpsPilotAI Console</span>
                        <p>你好，我可以帮你查询知识库、分析告警并生成运维建议。</p>
                    </div>
                    <div class="chat-messages" id="chatMessages">
                    </div>
                    
                    <div class="chat-input-container">
                        <div class="input-group-wrapper">
                            <div class="input-wrapper">
                                <input type="text" id="messageInput" placeholder="输入运维问题、告警现象或知识库查询" maxlength="1000" class="message-input">
                                <div class="input-bottom-bar">
                                    <div class="tools-btn-wrapper">
                                        <button class="tools-btn" id="toolsBtn" title="更多选项">
                                            <svg class="tools-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                                <circle cx="12" cy="12" r="1.5" fill="currentColor"/>
                                                <circle cx="19" cy="12" r="1.5" fill="currentColor"/>
                                                <circle cx="5" cy="12" r="1.5" fill="currentColor"/>
                                            </svg>
                                        </button>
                                        <div class="tools-menu" id="toolsMenu">
                                            <div class="tools-menu-item" id="uploadFileItem">
                                                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                                    <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                                </svg>
                                                <span>上传文件</span>
                                            </div>
                                            <div class="tools-menu-item" id="manageKnowledgeMenuItem">
                                                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                                    <path d="M4 5.5C4 4.67 4.67 4 5.5 4H10L12 6H18.5C19.33 6 20 6.67 20 7.5V18.5C20 19.33 19.33 20 18.5 20H5.5C4.67 20 4 19.33 4 18.5V5.5Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
                                                    <path d="M8 11H16M8 15H13" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                                                </svg>
                                                <span>知识库管理</span>
                                            </div>
                                        </div>
                                    </div>
                                    <label class="force-rag-toggle" title="强制使用知识库检索">
                                        <input type="checkbox" id="forceRagToggle">
                                        <span class="toggle-track" aria-hidden="true"></span>
                                        <span>知识库优先</span>
                                    </label>
                                    <div class="right-actions">
                                        <div class="mode-selector-wrapper">
                                            <button class="mode-selector-btn" id="modeSelectorBtn">
                                                <span id="currentModeText">快速</span>
                                                <svg class="dropdown-arrow" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                                    <path d="M6 9L12 15L18 9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                                </svg>
                                            </button>
                                            <div class="mode-dropdown" id="modeDropdown">
                                                <div class="dropdown-header">选择对话方式</div>
                                                <div class="dropdown-item active" data-mode="quick">
                                                    <div class="dropdown-item-main">
                                                        <span>快速</span>
                                                        <span class="badge-new">默认</span>
                                                    </div>
                                                    <div class="dropdown-item-sub">一次性返回完整答案</div>
                                                </div>
                                                <div class="dropdown-item" data-mode="stream">
                                                    <div class="dropdown-item-main">
                                                        <span>流式</span>
                                                    </div>
                                                    <div class="dropdown-item-sub">边生成边输出</div>
                                                </div>
                                            </div>
                                        </div>
                                        <button class="send-btn-circle" id="sendButton" title="发送">
                                            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                                <path d="M22 2L11 13M22 2L15 22L11 13M22 2L2 9L11 13" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                            </svg>
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <input type="file" id="fileInput" accept=".txt,.md,.docx,.pdf,.xlsx" style="display: none;">
                        <input type="file" id="replaceFileInput" accept=".txt,.md,.docx,.pdf,.xlsx" style="display: none;">
                    </div>
                </div>
            </section>
        </main>
    </div>

    <div class="knowledge-modal" id="knowledgeModal" aria-hidden="true">
        <div class="knowledge-modal-backdrop" id="knowledgeModalBackdrop"></div>
        <section class="knowledge-panel" role="dialog" aria-modal="true" aria-labelledby="knowledgeManagerTitle">
            <header class="knowledge-panel-header">
                <div>
                    <span class="panel-kicker">KNOWLEDGE BASE</span>
                    <h2 id="knowledgeManagerTitle">知识库管理</h2>
                </div>
                <div class="knowledge-panel-header-actions">
                    <span class="knowledge-summary" id="knowledgeManagerSummary">加载中</span>
                    <button class="icon-btn" id="refreshKnowledgeBtn" title="刷新文档列表" aria-label="刷新文档列表">
                        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M20 11A8 8 0 1 0 21.5 16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M20 4V11H13" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    </button>
                    <button class="icon-btn" id="closeKnowledgeBtn" title="关闭" aria-label="关闭">
                        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M6 6L18 18M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                    </button>
                </div>
            </header>
            <div class="knowledge-table-wrap">
                <table class="knowledge-table">
                    <thead>
                        <tr>
                            <th>文档</th>
                            <th>类型</th>
                            <th>索引状态</th>
                            <th>分片</th>
                            <th>更新时间</th>
                            <th class="knowledge-actions-heading">操作</th>
                        </tr>
                    </thead>
                    <tbody id="knowledgeDocumentList"></tbody>
                </table>
                <div class="knowledge-empty" id="knowledgeEmptyState" hidden>暂无知识库文档</div>
            </div>
            <footer class="knowledge-pagination" id="knowledgePagination" hidden></footer>
        </section>
    </div>

    <!-- 加载遮罩层 -->
    <div id="loadingOverlay" class="loading-overlay">
        <div class="loading-content">
            <div class="loading-spinner"></div>
            <div class="loading-text">智能运维分析中，请稍候...</div>
            <div class="loading-subtext">后端正在处理，请耐心等待</div>
        </div>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
